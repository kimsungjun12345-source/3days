<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f3" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161513" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="작심삼일 — 딱 3일만 약속하는 습관 앱. 3일마다 돌 하나, 무너지면 다시 쌓기." />
  <title>작심삼일</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="작심삼일" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪨</text></svg>" />
</head>
<body>
  <div class="app">

    <header class="appbar">
      <h1 class="brand">작심<em>삼일</em></h1>
    </header>

    <section class="hero" id="stats" hidden>
      <div class="garden" id="hero-garden" aria-hidden="true"></div>
      <div class="hero-foot">
        <div>
          <span class="hero-label">돌탑과 함께한 날</span>
          <span class="hero-big"><b id="stat-total-days">0</b>일</span>
        </div>
        <div class="hero-sub">
          쌓은 돌 <b id="stat-cycles">0</b> · 다시 쌓음 <b id="stat-restarts">0</b>
        </div>
      </div>
    </section>

    <section class="empty" id="empty" hidden>
      <div class="empty-cairn" aria-hidden="true"></div>
      <h2>첫 돌을 쌓아볼까요?</h2>
      <p>
        약속은 딱 3일. 3일을 채우면 돌 하나가 쌓여요.<br />
        무너져도 괜찮아요 — 돌탑은 원래<br />
        무너지면 다시 쌓는 거니까요.
      </p>
    </section>

    <div class="section-head" id="section-head" hidden>
      <h2>오늘의 작심</h2>
    </div>

    <main id="goal-list" class="goal-list"></main>

    <button class="add-card" id="btn-add">＋ <b>새 작심 만들기</b><span class="add-sub"> — 딱 3일만 약속해요</span></button>

    <p class="note" id="note" hidden></p>

    <div class="notify-row" id="notify-row" hidden>
      <span class="notify-text">
        <b>돌 얹을 시간 알림</b>
        <span>저녁 9시에 조용히 알려드려요. 쉬는 동안에도 돌아올 자리를 남겨둡니다.</span>
      </span>
      <button type="button" class="switch" id="btn-notify" role="switch" aria-checked="false" aria-label="알림 받기">
        <span class="switch-knob"></span>
      </button>
    </div>

    <button class="install-card" id="btn-install" hidden>
      <span class="install-icon" aria-hidden="true"></span>
      <span class="install-text">
        <b>홈 화면에 두기</b>
        <span id="install-sub">앱처럼 열리고, 인터넷이 없어도 돌을 얹을 수 있어요</span>
      </span>
    </button>

    <div class="data-actions">
      <button type="button" id="btn-export">기록 내보내기</button>
      <span aria-hidden="true">·</span>
      <button type="button" id="btn-import">가져오기</button>
      <input type="file" id="file-import" accept="application/json,.json" hidden />
    </div>

    <footer class="footer">
      <p>작심삼일도 여러 번 하면, 평생이 된다</p>
    </footer>

    <!-- 작심 기록 -->
    <div class="modal-backdrop" id="detail" hidden>
      <div class="modal detail" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <div class="detail-head">
          <span class="detail-ico" id="detail-ico"></span>
          <h2 id="detail-title"></h2>
        </div>

        <div class="detail-stats" id="detail-stats"></div>

        <div class="cal-head">
          <span>지난 12주</span>
          <span class="cal-legend">
            <i class="cal-dot"></i> 쉬어감
            <i class="cal-dot on"></i> 쌓은 날
          </span>
        </div>
        <div class="cal-wrap">
          <div class="cal-days" aria-hidden="true">
            <span>일</span><span></span><span>화</span><span></span><span>목</span><span></span><span>토</span>
          </div>
          <div class="cal" id="detail-cal"></div>
        </div>
        <p class="detail-word" id="detail-word"></p>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost btn-danger" id="detail-delete">지우기</button>
          <button type="button" class="btn btn-primary" id="detail-close">닫기</button>
        </div>
      </div>
    </div>

    <!-- 완주 축하 -->
    <div class="cheer-backdrop" id="cheer" hidden>
      <div class="cheer" role="dialog" aria-modal="true" aria-labelledby="cheer-title">
        <div class="cheer-cairn" id="cheer-cairn" aria-hidden="true"></div>
        <p class="cheer-kicker" id="cheer-kicker">작심삼일 완주</p>
        <h2 class="cheer-title" id="cheer-title">네 번째 돌을 얹었어요</h2>
        <p class="cheer-goal" id="cheer-goal"></p>
        <div class="cheer-stats" id="cheer-stats"></div>
        <p class="cheer-word" id="cheer-word"></p>
        <button class="btn btn-primary" id="cheer-next">또 작심하기 — 다음 3일</button>
        <div class="cheer-foot">
          <button type="button" class="btn btn-ghost" id="cheer-share">이 순간 저장하기</button>
          <button type="button" class="btn btn-ghost" id="cheer-close">오늘은 여기까지</button>
        </div>
      </div>
    </div>

    <!-- 새 작심 바텀시트 -->
    <div class="modal-backdrop" id="modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">새 작심</h2>
        <p class="modal-sub">거창할 필요 없어요. 딱 3일만 해볼 것 하나.</p>
        <form id="form-add">
          <input
            type="text"
            id="input-title"
            maxlength="30"
            placeholder="예: 아침에 물 한 잔 마시기"
            autocomplete="off"
            required
          />
          <div class="suggest-row" id="suggest-row"></div>
          <div class="icon-row" id="icon-row"></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="btn-cancel">다음에</button>
            <button type="submit" class="btn btn-primary">3일 약속하기</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="confetti" class="confetti-layer" aria-hidden="true"></div>
  <script src="icons.js"></script>
  <script src="native.js"></script>
  <script src="share.js"></script>
  <script src="app.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
