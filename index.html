<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f6f3" />
  <meta name="description" content="작심삼일 — 딱 3일만 약속하는 습관 앱. 3일마다 돌 하나, 무너지면 다시 쌓기." />
  <title>작심삼일</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪨</text></svg>" />
</head>
<body>
  <div class="app">

    <header class="appbar">
      <h1 class="brand">작심<em>삼일</em></h1>
    </header>

    <section class="hero" id="stats" hidden>
      <div class="hero-cairn" id="hero-cairn" aria-hidden="true"></div>
      <div class="hero-body">
        <div class="hero-label">돌탑과 함께한 날</div>
        <div class="hero-big"><span id="stat-total-days">0</span>일</div>
        <div class="hero-sub">
          쌓은 돌 <b id="stat-cycles">0</b> · 다시 쌓음 <b id="stat-restarts">0</b>
        </div>
      </div>
    </section>

    <section class="empty" id="empty" hidden>
      <div class="empty-cairn" aria-hidden="true"></div>
      <h2>첫 돌을 쌓아볼까요?</h2>
      <p>
        약속은 딱 3일. 3일을 채우면 돌 하나가 쌓여요.<br />
        무너져도 괜찮아요 — 돌탑은 원래<br />
        무너지면 다시 쌓는 거니까요.
      </p>
    </section>

    <div class="section-head" id="section-head" hidden>
      <h2>오늘의 작심</h2>
    </div>

    <main id="goal-list" class="goal-list"></main>

    <button class="add-card" id="btn-add">＋ <b>새 작심 만들기</b><span class="add-sub"> — 딱 3일만 약속해요</span></button>

    <p class="note" id="note" hidden></p>

    <footer class="footer">
      <p>작심삼일도 여러 번 하면, 평생이 된다</p>
    </footer>

    <!-- 새 작심 바텀시트 -->
    <div class="modal-backdrop" id="modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">새 작심</h2>
        <p class="modal-sub">거창할 필요 없어요. 딱 3일만 해볼 것 하나.</p>
        <form id="form-add">
          <div class="emoji-row" id="emoji-row"></div>
          <input
            type="text"
            id="input-title"
            maxlength="30"
            placeholder="예: 아침에 물 한 잔 마시기"
            autocomplete="off"
            required
          />
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="btn-cancel">다음에</button>
            <button type="submit" class="btn btn-primary">3일 약속하기</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="confetti" class="confetti-layer" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
