name: 안드로이드 빌드

# 맥 없이 안드로이드 앱을 만들기 위한 워크플로.
# - 평소: 푸시할 때마다 디버그 APK를 만들어 기기에 바로 설치해 볼 수 있게 한다
# - 릴리스: 태그를 밀거나 수동 실행하면 서명된 AAB(스토어 업로드용)를 만든다
#
# 서명에 필요한 값은 저장소 Settings → Secrets에 넣어 둔다.
#   ANDROID_KEYSTORE_BASE64  : keystore 파일을 base64로 변환한 문자열
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# (base64 변환:  base64 -w0 jaksimsamil.keystore  또는 macOS는  base64 -i ...)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "서명된 AAB까지 만들기 (시크릿 설정 필요)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 폰에서 바로 받을 수 있게 릴리스에 APK를 올리려면 쓰기 권한이 필요하다
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor 8 CLI는 Node 22 이상을 요구한다
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 안드로이드 SDK 준비
        uses: android-actions/setup-android@v3

      - name: 의존성 설치
        run: npm ci

      # 검사를 빌드 앞에 세운다. 뒤에 두면 이미 만들어진 APK가 릴리스에
      # 올라간 뒤에야 빨간 불이 들어오고, 그러면 폰에 까는 사람은 깨진
      # 빌드를 먼저 만난다. 여기서 막으면 애초에 올라가지 않는다.
      - name: 검사용 크로미움
        run: npx playwright-core install --with-deps chromium

      - name: 검사 (스모크 · PWA · 명암비)
        run: npm test

      - name: 웹 자산 빌드 후 네이티브에 동기화
        # 디버그 APK는 테스트용이므로 개발자 도구를 대놓고 보여 준다.
        # 스토어용 빌드는 아래에서 BUILD_CHANNEL=release 로 다시 만든다.
        env:
          BUILD_CHANNEL: dev
        run: |
          npm run build
          npx cap sync android

      - name: 디버그 APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: APK 이름 붙이기
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/jaksimsamil-$(date +%m%d)-${GITHUB_SHA::7}.apk"
          ls -lh dist/

      # ── 다시 설치하지 않아도 되는 빌드 ──────────────────
      # 껍데기(플러그인·알림·햅틱)는 그대로 두고 화면만 웹에서 받아온다.
      # 한 번 깔아 두면 그 뒤로는 앱을 다시 여는 것만으로 최신 화면이 뜬다.
      # 저장소 변수 LIVE_URL이 있을 때만 만든다 (pages.yml 참고).
      - name: 살아있는 빌드
        if: vars.LIVE_URL != ''
        run: |
          node scripts/live-config.js "${{ vars.LIVE_URL }}"
          npx cap sync android
          ./gradlew assembleDebug --no-daemon -p android
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/jaksimsamil-live-$(date +%m%d)-${GITHUB_SHA::7}.apk"
          node scripts/live-config.js --revert
          ls -lh dist/

      - name: 디버그 APK 올리기 (PC에서 받을 때)
        uses: actions/upload-artifact@v4
        with:
          name: jaksimsamil-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      # 깃허브 모바일 앱과 아티팩트는 궁합이 나쁘다. 앱에서는 아티팩트를
      # 내려받을 수 없고, 브라우저로 받아도 zip을 풀어야 한다.
      # 릴리스에 올려 두면 폰에서 파일을 눌러 바로 설치할 수 있다.
      - name: 폰에서 바로 받도록 최신 빌드 릴리스 갱신
        if: github.ref_name == 'claude/jaksim-samil-app-salp5o' || github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: 최신 테스트 빌드 (개발용)
          body: |
            폰에서 바로 설치해 볼 수 있는 최신 빌드입니다.
            아래 `.apk` 파일을 눌러 받으세요. (처음 설치할 때
            "이 출처의 앱 설치 허용"을 한 번 켜 주셔야 합니다.)

            - 커밋: ${{ github.sha }}
            - 내용: ${{ github.event.head_commit.message }}

            서명되지 않은 개발용 빌드라 스토어 배포에는 쓰지 않습니다.
          prerelease: true
          files: dist/*.apk

      # ── 여기서부터는 스토어 업로드용 (시크릿이 있을 때만) ──

      - name: 서명 키 복원
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 시크릿이 없습니다. BUILD.md의 서명 키 만들기를 먼저 진행하세요."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android/app/release.keystore

      - name: 스토어용으로 웹 자산 다시 빌드 (개발자 도구 없이)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          BUILD_CHANNEL: release
        run: |
          npm run build
          npx cap sync android

      - name: 서명된 AAB
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
        working-directory: android

      - name: AAB 올리기
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: jaksimsamil-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: 서명 키 지우기
        if: always()
        run: rm -f android/app/release.keystore
